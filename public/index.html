<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#116149" />
    <meta name="description" content="Portable Lightning credit passport for Kenyan farmers." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>SabiCredit</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="brand">
          <h1>Sabi</h1>
          <div class="tagline">Lightning credit passport for smallholder farmers</div>
        </div>
        <nav class="topnav">
          <button class="navbtn" data-target="repay">Repay</button>
          <button class="navbtn" data-target="passport">Passport</button>
          <button class="navbtn" data-target="profile">Profile</button>
          <button class="navbtn" data-target="scanner">Scanner</button>
          <a class="navbtn" href="/admin.html">Admin</a>
        </nav>
      </div>
    </header>

    <main class="container">
    <div id="views">
      <div id="home" class="card">
        <div class="home-grid">
          <div>
            <div id="farmerName" class="muted">Farmer</div>
            <div class="name"><strong id="name">John Mwangi</strong></div>
            <div class="status-row">
              <div class="status-stat">
                <span class="label">Credit Score</span>
                <span id="score" class="big">300</span>
              </div>
              <div class="status-stat" style="margin-left: 8px;">
                <span class="label">Loans Repaid</span>
                <strong id="loans" style="font-size: 1.5rem; color: var(--text-primary); margin-top: 4px;">0</strong>
              </div>
              <div class="status-stat" style="margin-left: 8px;">
                <span class="label">Defaults</span>
                <strong id="defaults" style="font-size: 1.5rem; color: var(--accent-danger); margin-top: 4px;">0</strong>
              </div>
            </div>
          </div>
          <div class="home-actions">
            <button id="toRepay" class="primary">Make a repayment</button>
            <button id="toPassport" class="secondary">View passport</button>
            <button id="toProfile" class="secondary">Edit profile</button>
            <button id="toScanner" class="secondary">Lender scanner</button>
          </div>
        </div>
      </div>

      <section id="repay" class="card hidden">
        <h3>Repay</h3>
        <label>Farmer ID</label>
        <input id="repay_farmer_id" value="jmwangi_kisii" placeholder="farmer id (e.g. jmwangi_kisii)" />
        <label>Lender</label>
        <select id="repay_lender"><option>Apollo Agriculture</option><option>Kisii SACCO</option><option>Microfinance</option><option>Other</option></select>
        <label>Amount (KES)</label>
        <input id="repay_amount" type="number" value="4500" />
        <label>Phone Number (for simulated payment prompt)</label>
        <input id="repay_phone" type="text" placeholder="+254790000000 (optional)" value="+254790000000" />
        <div class="controls">
          <button id="createInvoice" class="primary">Send Prompt</button>
          <button id="backFromRepay" class="secondary">Back</button>
        </div>
        <div id="invoiceArea" class="mt"></div>
      </section>

      <section id="passport" class="card hidden">
        <h3>Credit Passport</h3>
        <div id="passportArea"></div>
        <div class="controls mt">
          <input id="passport_id" value="jmwangi_kisii" placeholder="farmer id" style="flex:1;min-width:160px" />
          <button id="loadPassport" class="primary">Load</button>
          <button id="passportQR" class="secondary">Share QR</button>
          <button id="backFromPassport" class="secondary">Back</button>
        </div>
        <div id="passportQRArea" class="mt"></div>
      </section>

      <section id="profile" class="card hidden">
        <h3>Profile</h3>
        <label>Farmer ID</label>
        <input id="profile_id" value="jmwangi_kisii" />
        <div class="two-col">
          <div>
            <label>Name</label>
            <input id="profile_name" />
          </div>
          <div>
            <label>County</label>
            <input id="profile_county" />
          </div>
        </div>
        <div class="controls">
          <button id="saveProfile" class="primary">Save Profile</button>
          <button id="backFromProfile" class="secondary">Back</button>
        </div>
        <div id="profileMsg" class="muted mt"></div>
      </section>

      <section id="scanner" class="card hidden">
        <h3>Lender Scanner</h3>
        <label>Paste Passport JSON</label>
        <textarea id="scanner_input" rows="8"></textarea>
        <div class="controls mt"><button id="verifyPassport" class="primary">Verify credential</button> <button id="backFromScanner" class="secondary">Back</button></div>
        <div id="scannerResult" class="mt"></div>
      </section>
    </div>

    </main>

    <footer class="container muted small">
      Sabi • prototype <span id="pwaStatus" aria-live="polite"></span>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
